<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help</title>
    <link rel="stylesheet" href="help.css">
</head>
<body>
    <div class="main-container">
        <div class="navigation-container">
            <div class="left-container">
                <img src="../Images/safari logo.png">
            </div>
            <div class="right-container">
                <select id="language">
                    <option>Eng</option>
                    <option>NP</option>
                </select>
                <a href="login.html" id="login">Login</a>
            </div>
        </div>
        <div class="content-container">
            <div class="content-heading-container">
                <h1>Welcome to Safari Support</h1>
                <p>We’re here to help. Looking for customer service contact information? Explore support resources for the relevant products below to find the best way to reach out about your issue.</p>
            </div>
            <div class="service-container">
                <div class="ride-container">
                    <i class="fa-solid fa-taxi"></i>
                    <p>Rides</p>
                </div>
                <div class="riding-container">
                    <i class="fa-solid fa-car"></i>
                    <p>Driving & Delivering</p>
                </div>
                <div class="safari-eats">
                    <i class="fa-solid fa-kitchen-set"></i>
                    <p>Safari Eats</p>
                </div>
                <div class="auto-car-container">
                    <i class="fa-solid fa-car-tunnel"></i>
                    <p>Bikes and Scooter</p>
                </div>
                <div class="business-container">
                    <i class="fa-solid fa-briefcase"></i>
                    <p>Safari business</p>
                </div>
            </div>
        </div>
    </div>
<script src="https://kit.fontawesome.com/e29314cdc4.js" crossorigin="anonymous"></script>
<script src="help.js"></script>
</body>
</html>
